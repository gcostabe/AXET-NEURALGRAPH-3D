name: Build and Release Desktop Apps (.dmg & .msi)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Versão do release (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Universal (.dmg)
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src-tauri
            frontend
            scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Next.js Frontend
        working-directory: frontend
        run: npm run build

      - name: Build macOS DMG (Universal Binary)
        run: |
          npx --prefix frontend tauri build --target universal-apple-darwin
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Locate DMG Asset
        id: dmg_locate
        run: |
          DMG_FILE=$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name "*.dmg" | head -n 1)
          cp "$DMG_FILE" AXET-NeuralGraph.dmg
          echo "dmg_path=$DMG_FILE" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG_FILE"

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axet-macos-dmg
          path: |
            ${{ steps.dmg_locate.outputs.dmg_path }}
            AXET-NeuralGraph.dmg

      - name: Attach DMG to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.dmg_locate.outputs.dmg_path }}
            AXET-NeuralGraph.dmg

  build-windows:
    name: Build Windows Corporate (.msi)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src-tauri
            frontend
            scripts

      - name: Configure Windows Git (Longpaths)
        run: |
          git config --global core.longpaths true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci || npm install

      - name: Build Next.js Frontend
        working-directory: frontend
        run: npm run build

      - name: Add WiX to PATH
        run: echo "C:\Program Files (x86)\WiX Toolset v3.11\bin" >> $GITHUB_PATH
        shell: bash

      - name: Generate NTT DATA Corporate Authenticode Certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject "CN=NTT DATA Corporate, O=NTT DATA, C=BR" -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store "Root", "CurrentUser"
          $store.Open("ReadWrite")
          $store.Add($cert)
          $store.Close()
          Export-Certificate -Cert $cert -FilePath "NTT-DATA-Corporate.cer"
          echo "THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          Write-Host "Certificado NTT DATA gerado com sucesso. Thumbprint: $($cert.Thumbprint)"

      - name: Build Windows MSI (WiX Toolset)
        run: |
          npx --prefix frontend tauri build --bundles msi
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Sign Binaries and MSI with NTT DATA Authenticode
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMBPRINT"
          $filesToSign = Get-ChildItem -Path "src-tauri/target/release" -Include "*.exe","*.msi" -Recurse
          foreach ($file in $filesToSign) {
            Write-Host "Assinando com Authenticode: $($file.FullName)"
            try {
              Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256
            } catch {
              Write-Host "Timestamp falhou, assinando sem timestamp..."
              Set-AuthenticodeSignature -FilePath $file.FullName -Certificate $cert -HashAlgorithm SHA256
            }
          }

      - name: Locate MSI Asset and Prepare Companion Files
        id: msi_locate
        shell: bash
        run: |
          MSI_FILE=$(find src-tauri/target/release/bundle/msi -name "*.msi" | head -n 1)
          cp "$MSI_FILE" AXET-NeuralGraph-Setup.msi
          cp scripts/instalar_certificado_nttdata.bat instalar_certificado_nttdata.bat
          echo "msi_path=$MSI_FILE" >> $GITHUB_OUTPUT
          echo "Found MSI: $MSI_FILE"

      - name: Sign Renamed MSI
        shell: pwsh
        run: |
          $cert = Get-Item "Cert:\CurrentUser\My\$env:THUMBPRINT"
          Set-AuthenticodeSignature -FilePath "AXET-NeuralGraph-Setup.msi" -Certificate $cert -TimestampServer "http://timestamp.digicert.com" -HashAlgorithm SHA256

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: axet-windows-msi
          path: |
            ${{ steps.msi_locate.outputs.msi_path }}
            AXET-NeuralGraph-Setup.msi
            NTT-DATA-Corporate.cer
            instalar_certificado_nttdata.bat

      - name: Attach MSI to GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ steps.msi_locate.outputs.msi_path }}
            AXET-NeuralGraph-Setup.msi
            NTT-DATA-Corporate.cer
            instalar_certificado_nttdata.bat
