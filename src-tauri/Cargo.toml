[package]
name = "axet-neuralgraph-desktop"
version = "1.0.12"
description = "AXET NeuralGraph 3D - Enterprise Knowledge Assistant"
authors = ["Gustavo Costa Berbert <gcostabe@emeal.nttdata.com>", "Marcio Miguel"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-shell = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
